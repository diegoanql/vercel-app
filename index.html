<style>
:root{--paper:#F6ECEA;--card:#FFFDFC;--ink:#3D1424;--soft:#8A6170;--red:#D7263D;--sage:#7E9C83;--gold:#E3A83B;--line:#E7D3D0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:'Gloock',Georgia,serif;font-weight:400;line-height:1.15}
h1{font-size:2rem}h2{font-size:1.55rem;margin-bottom:6px}h3{font-size:1.15rem}
a{color:var(--red)}
main{max-width:560px;margin:0 auto;padding:22px 18px 120px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.center{text-align:center}
.muted{color:var(--soft);font-size:.9rem}
.hand{font-family:'Caveat',cursive}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button{cursor:pointer}
.btn{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:11px 18px;font:inherit;font-weight:500}
.btn.red{background:var(--red)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.small{padding:6px 13px;font-size:.88rem}

nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:1000}
nav.tabs button{background:none;border:0;font:inherit;font-size:.72rem;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 10px}

#modal.open{display:flex}
#modal .sheet{background:var(--card);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 18px calc(26px + env(safe-area-inset-bottom));position:relative}
#modal .x{position:absolute;top:12px;right:14px;background:none;border:0;font-size:1.3rem;color:var(--soft)}
label{display:block;font-size:.9rem;color:var(--soft);margin:12px 0 4px}
label.check{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:1rem}
label.check input{width:auto}
input,textarea,select{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
textarea{resize:vertical}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .25s;z-index:3000;pointer-events:none;font-size:.95rem;max-width:90vw;text-align:center}

<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module">
/* =========================================================
   1) PEGA AQUÍ LOS DATOS DE TU PROYECTO DE SUPABASE
   (Project Settings → API: "Project URL" y la clave "anon" o "publishable").
   Mientras diga "PEGA_AQUI", la app corre en modo demo.
   Esta clave puede ser pública: lo que protege los datos son las reglas del archivo setup.sql.
   ========================================================= */
const SUPABASE_URL = "https://cwxvusohsjbsgmxahrnj.supabase.co";
const SUPABASE_KEY = "sb_publishable_RplY9WPOV_M44rVKfpk9ZQ_TmHYh5fs";
const DEMO = SUPABASE_URL === "PEGA_AQUI";

const COLS = ['fotos','recuerdos','fechas','planes','chat','canciones','cupones','premios','puntos','pareja'];
const S = { user:null, view:'inicio', shell:false, booted:false, unlocked:false, mapPick:null, planTab:'cita', cupTab:'mios', notified:false,
  info:{}, data:Object.fromEntries(COLS.map(c=>[c,[]])) };
let Store, authApi, map, unsubs = [];

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseD = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, m-1, d); };
const daysBetween = (a,b) => Math.round((b-a)/864e5);
const fmt = s => s ? parseD(s).toLocaleDateString('es-VE',{day:'numeric',month:'long',year:'numeric'}) : '';
const fmtShort = s => s ? parseD(s).toLocaleDateString('es-VE',{day:'numeric',month:'short'}) : '';
const hora = ts => new Date(ts).toLocaleString('es-VE',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const me = () => S.user.uid;
const nameOf = uid => S.data.puntos.find(p=>p.id===uid)?.name || (uid===me() ? 'Tú' : 'Mi amor');
const partner = () => S.data.puntos.find(p=>p.id!==me());
const ptsOf = uid => S.data.puntos.find(p=>p.id===uid)?.pts || 0;
const byDateDesc = (a,b) => (b.date||b.fecha||'').localeCompare(a.date||a.fecha||'') || (b.createdAt||0)-(a.createdAt||0);
const visibleFotos = () => S.data.fotos.filter(f=>!f.hidden).sort(byDateDesc);
const empty = t => `<p class="muted" style="padding:30px 0;text-align:center">${t}</p>`;

function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2600); }
function modal(html){ const m=$('#modal'); m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><button class="x" data-act="close" aria-label="Cerrar">✕</button>${html}</div>`; m.classList.add('open'); }
function closeModal(){ $('#modal').classList.remove('open'); $('#modal').innerHTML=''; }
async function award(n, why){ await Store.incr('puntos', me(), 'pts', n); toast(`+${n} puntos ${why}`); }
async function sha(s){ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('nosotros:'+s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }

function compress(file, max, q){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max/Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}

function nextOcc(f){
  if(!f.fecha) return null;
  const d = parseD(f.fecha), t = parseD(ymd());
  if(f.anual){ d.setFullYear(t.getFullYear()); if(d < t) d.setFullYear(t.getFullYear()+1); }
  return d;
}
function fechasConDias(){
  const t = parseD(ymd());
  return S.data.fechas.map(f => ({...f, dias: nextOcc(f) ? daysBetween(t, nextOcc(f)) : -1})).filter(f=>f.dias>=0).sort((a,b)=>a.dias-b.dias);
}
const alertFechas = () => fechasConDias().filter(f => f.dias <= (+f.aviso || 7));
function checkAlerts(){
  if(S.notified || !('Notification' in window) || Notification.permission !== 'granted') return;
  const a = alertFechas(); if(!a.length) return;
  S.notified = true;
  a.forEach(f => { try{ new Notification(f.dias ? `Faltan ${f.dias} días` : '¡Es hoy!', {body:f.titulo}); }catch(e){} });
}
function gcal(titulo, fecha, anual, horaStr){
  const d = parseD(fecha); let dates;
  if(horaStr){ const [h,m]=horaStr.split(':'); d.setHours(+h, +m); const e=new Date(d.getTime()+2*36e5);
    const z = x => ymd(x).replace(/-/g,'')+'T'+String(x.getHours()).padStart(2,'0')+String(x.getMinutes()).padStart(2,'0')+'00';
    dates = z(d)+'/'+z(e);
  } else { const e=new Date(d); e.setDate(e.getDate()+1); dates = ymd(d).replace(/-/g,'')+'/'+ymd(e).replace(/-/g,''); }
  const u = new URLSearchParams({action:'TEMPLATE', text:titulo, dates, details:'Desde nuestra app ♥'});
  if(anual) u.set('recur','RRULE:FREQ=YEARLY');
  return 'https://calendar.google.com/calendar/render?'+u;
}

/* ---------- backend: Supabase o demo ---------- */
async function initBackend(){
  if(DEMO){ Store = demoStore(); authApi = { logout: async()=>{ S.user=null; S.booted=false; renderLogin(); } }; renderLogin(); return; }
  const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
  const cache = {}, subs = {}; let channel = null;
  const toDoc = r => ({...r.data, id:r.id, createdAt:r.created_at});
  const emit = c => (subs[c]||[]).forEach(f => f(Object.values(cache[c]||{}).map(d => ({...d}))));
  const put = (c, d) => { (cache[c] ??= {})[d.id] = d; emit(c); };
  const fail = e => { if(e){ console.error(e); toast('No se pudo guardar. Revisa la conexión o el setup de Supabase'); throw e; } };
  Store = {
    start(){
      channel = sb.channel('items').on('postgres_changes', {event:'*', schema:'public', table:'items'}, p => {
        if(p.eventType === 'DELETE'){ const o = p.old; if(cache[o.col]){ delete cache[o.col][o.id]; emit(o.col); } }
        else put(p.new.col, toDoc(p.new));
      }).subscribe();
    },
    stop(){ if(channel) sb.removeChannel(channel); channel = null; for(const k in subs) delete subs[k]; for(const k in cache) delete cache[k]; },
    listen(col, cb, last){
      (subs[col] ??= []).push(cb);
      sb.from('items').select('*').eq('col', col).order('created_at', {ascending:false}).limit(last || 5000).then(({data, error}) => {
        if(error) return toast('Error de permisos: revisa el setup.sql de Supabase');
        cache[col] = Object.fromEntries(data.map(r => [r.id, toDoc(r)])); emit(col);
      });
      return () => subs[col] = (subs[col]||[]).filter(f => f !== cb);
    },
    async add(col, data){
      const id = crypto.randomUUID(), created_at = Date.now();
      put(col, {...data, id, createdAt:created_at});
      const {error} = await sb.from('items').insert({col, id, data, created_at}); fail(error); return id;
    },
    async update(col, id, data){
      put(col, {...(cache[col]?.[id] || {id}), ...data});
      const {error} = await sb.rpc('merge_item', {p_col:col, p_id:id, p_data:data}); fail(error);
    },
    set(col, id, data){ return Store.update(col, id, data); },
    async remove(col, id){
      if(cache[col]){ delete cache[col][id]; emit(col); }
      const {error} = await sb.from('items').delete().eq('col', col).eq('id', id); fail(error);
    },
    async get(col, id){ const {data} = await sb.from('items').select('*').eq('col', col).eq('id', id).maybeSingle(); return data ? toDoc(data) : null; },
    async incr(col, id, field, n){
      const cur = cache[col]?.[id] || {id}; put(col, {...cur, [field]:(cur[field]||0)+n});
      const {error} = await sb.rpc('incr_item', {p_col:col, p_id:id, p_field:field, p_n:n}); fail(error);
    },
    async uploadFull(id, blob){ const {error} = await sb.storage.from('fotos').upload(id+'.jpg', blob, {contentType:'image/jpeg', upsert:true}); fail(error); },
    async fullUrl(id){ const {data} = await sb.storage.from('fotos').createSignedUrl(id+'.jpg', 3600); return data?.signedUrl || null; },
    async removeFull(id){ await sb.storage.from('fotos').remove([id+'.jpg']); },
  };
  authApi = {
    login: async (email, password) => { const {error} = await sb.auth.signInWithPassword({email, password}); if(error) throw error; },
    logout: () => sb.auth.signOut(),
  };
  sb.auth.onAuthStateChange((ev, session) => {
    const u = session?.user;
    setTimeout(() => {
      if(u){ if(S.user?.uid !== u.id){ S.user = {uid:u.id}; S.booted = false; boot(); } }
      else { S.user = null; S.booted = false; Store.stop(); renderLogin(); }
    }, 0);
  });
}

function demoStore(){
  const mem = Object.fromEntries(COLS.map(c=>[c,[]])), subs = {};
  const col = c => (mem[c] ??= []);
  const emit = c => (subs[c]||[]).forEach(f => f(col(c).map(d=>({...d}))));
  const find = (c,id) => col(c).find(d=>d.id===id);
  seed(mem);
  return {
    listen(c, cb){ (subs[c] ??= []).push(cb); cb(col(c).map(d=>({...d}))); return () => subs[c] = subs[c].filter(f=>f!==cb); },
    async add(c, data){ const id = Math.random().toString(36).slice(2,10); col(c).push({id, ...data, createdAt:Date.now()}); emit(c); return id; },
    async update(c, id, data){ Object.assign(find(c,id)||{}, data); emit(c); },
    async remove(c, id){ mem[c] = col(c).filter(d=>d.id!==id); emit(c); },
    async get(c, id){ const d = find(c,id); return d ? {...d} : null; },
    async set(c, id, data){ const d = find(c,id); d ? Object.assign(d, data) : col(c).push({id, ...data}); emit(c); },
    async incr(c, id, f, n){ const d = find(c,id); d ? d[f] = (d[f]||0)+n : col(c).push({id, [f]:n}); emit(c); },
    async uploadFull(){}, async fullUrl(){ return null; }, async removeFull(){},
  };
}
function seed(m){
  const t = new Date(), d = n => { const x = new Date(); x.setDate(x.getDate()+n); return ymd(x); };
  const ini = ymd(new Date(t.getFullYear()-2, t.getMonth(), t.getDate()+5));
  const ph = (a,b,e) => 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><text x="50" y="62" font-size="32" text-anchor="middle">${e}</text></svg>`);
  m.pareja.push({id:'info', inicio:ini, lugar:{lat:10.6766, lng:-71.6047, nombre:'Vereda del Lago', historia:'Una caminata que se alargó hasta el atardecer. Ahí empezó todo.'}});
  m.puntos.push({id:'u1', name:'Diego', pts:45}, {id:'u2', name:'Mi amor', pts:60});
  [['#F4A6B7','#D7263D','🌅','Atardecer en el lago',d(-3),10.6766,-71.6047,false],
   ['#B8D0BD','#7E9C83','🌴','Nuestra primera playa',d(-60),11.17,-71.80,false],
   ['#F7D488','#E3A83B','🍝','Cena de aniversario',d(-120),10.66,-71.62,false],
   ['#C9B6E4','#8A6170','🎡','La feria',d(-200),null,null,false],
   ['#3D1424','#8A6170','🤫','Solo nuestra',d(-10),null,null,true]]
   .forEach(([a,b,e,cap,date,lat,lng,hidden],i) => m.fotos.push({id:'f'+i, thumb:ph(a,b,e), caption:cap, date, lat, lng, hidden, by:'u1', createdAt:i}));
  m.recuerdos.push({id:'r1', titulo:'El día que nos conocimos', fecha:ini, texto:'Llegamos tarde los dos y terminamos riéndonos de eso toda la noche.'},
                   {id:'r2', titulo:'Primer viaje juntos', fecha:d(-60), texto:'Se nos olvidó el protector solar. Nunca más.'});
  m.fechas.push({id:'d1', titulo:'Nuestro aniversario', fecha:ini, anual:true, aviso:7}, {id:'d2', titulo:'Su cumpleaños', fecha:d(40), anual:true, aviso:15});
  m.planes.push({id:'p1', tipo:'cita', titulo:'Cena en un sitio nuevo', fecha:d(3), hora:'19:30', lugar:'Por decidir', estado:'planeado'},
                {id:'p2', tipo:'viaje', titulo:'Mérida en diciembre', estado:'idea', notas:'Teleférico y fresas con crema'},
                {id:'p3', tipo:'futuro', titulo:'Nuestra casa con patio', estado:'idea'},
                {id:'p4', tipo:'romantico', titulo:'Picnic sorpresa', estado:'idea'},
                {id:'p5', tipo:'cita', titulo:'Cine y helado', fecha:d(-15), estado:'hecho'});

/* ---------- arranque ---------- */
function boot(){
  if(S.booted) return; S.booted = true;
  $('#app').innerHTML = '<main id="main"></main><nav class="tabs" id="tabs" aria-label="Secciones"></nav>';
  S.shell = true; S.view = 'inicio';
  Store.start?.();
  COLS.forEach(c => unsubs.push(Store.listen(c, docs => onData(c, docs), c==='chat' ? 300 : 0)));
  Store.incr('puntos', me(), 'pts', 0);
  render();
}
function onData(c, docs){
  S.data[c] = docs;
  if(c === 'pareja') S.info = docs.find(d=>d.id==='info') || {};
  if(c === 'fechas') checkAlerts();
  if(!S.shell || !$('#main')) return;
  if(S.view === 'chat'){ if(c==='chat') renderMsgs(); return; }
  if(S.view === 'mapa' && !['fotos','pareja'].includes(c)) return;
  render();
}

function renderLogin(){
  S.shell = false;
  $('#app').innerHTML = `<div class="login">
    <h1 style="font-size:2.8rem">Nosotros</h1>
    <p class="hand" style="font-size:1.6rem;margin-bottom:22px">nuestro rincón privado</p>
    ${DEMO ? `<p class="muted">Modo demostración: nada se guarda. Conecta Supabase para usarla de verdad.</p>
      <div class="actions"><button class="btn red" data-act="demo" data-u="u1">Entrar como Diego</button><button class="btn ghost" data-act="demo" data-u="u2">Entrar como mi amor</button></div>`
    : `<label for="li-e">Correo</label><input id="li-e" type="email" autocomplete="email">
      <label for="li-p">Contraseña</label><input id="li-p" type="password" autocomplete="current-password">
      <div class="actions"><button class="btn red" data-act="login">Entrar</button></div><p id="li-err" class="muted" style="margin-top:10px"></p>`}
  </div>`;
}

  const v = VIEWS[S.view] || VIEWS.inicio;

  $('#main').innerHTML = v();
  const tab = TABS.some(t=>t[0]===S.view) ? S.view : (S.view==='ocultas' ? 'album' : 'mas');
  $('#tabs').innerHTML = TABS.map(([id,ic,t]) => `<button data-act="go" data-v="${id}" class="${tab===id?'on':''}" ${tab===id?'aria-current="page"':''}><span class="ic">${ic}</span>${t}</button>`).join('');
  if(S.view === 'mapa') initMap();
  if(S.view === 'chat') renderMsgs();
}
function go(v){ S.view = v; render(); window.scrollTo(0,0); }

/* ---------- mapa ---------- */
function initMap(){
  const el = $('#map'); if(!el) return;
  if(!window.L){ el.innerHTML = '<p class="muted" style="padding:20px">No se pudo cargar el mapa. Revisa tu conexión.</p>'; return; }
  const l = S.info.lugar, fotos = (S.unlocked ? S.data.fotos : visibleFotos()).filter(f => f.lat != null);
  const center = l ? [l.lat, l.lng] : fotos[0] ? [fotos[0].lat, fotos[0].lng] : [10.6545, -71.6408];
  map = L.map(el).setView(center, 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);
  if(l) L.marker([l.lat, l.lng], {icon:L.divIcon({className:'', html:'<div class="pin-heart">❤️</div>', iconSize:[34,34], iconAnchor:[17,30]})}).addTo(map).bindPopup(`<b>${esc(l.nombre)}</b><br>Aquí empezó todo`);
  fotos.forEach(f => L.marker([f.lat, f.lng], {icon:L.divIcon({className:'', html:`<div class="pin-photo"><img src="${f.thumb}" alt=""></div>`, iconSize:[46,46], iconAnchor:[23,23]})}).addTo(map).on('click', () => openFoto(f.id)));
  map.on('click', e => onMapPick(e.latlng));
  const pts = [...(l ? [[l.lat, l.lng]] : []), ...fotos.map(f => [f.lat, f.lng])];
  if(pts.length > 1 && !S.mapPick) map.fitBounds(pts, {padding:[40,40], maxZoom:14});
  setTimeout(() => map && map.invalidateSize(), 60);
}
async function onMapPick({lat, lng}){
  const p = S.mapPick; if(!p) return;
  if(p.type === 'foto'){ S.mapPick = null; await Store.update('fotos', p.id, {lat, lng}); toast('Foto ubicada en el mapa'); render(); return; }
  const l = S.info.lugar || {};
  modal(`<h2>Donde empezó todo</h2><input type="hidden" id="li-lat" value="${lat}"><input type="hidden" id="li-lng" value="${lng}">
    <label for="li-n">Nombre del lugar</label><input id="li-n" value="${esc(l.nombre||'')}" placeholder="Ej: la heladería de la esquina">
    <label for="li-h">Nuestra historia</label><textarea id="li-h" rows="4" placeholder="Cuenta cómo pasó">${esc(l.historia||'')}</textarea>
    <div class="actions"><button class="btn red" data-act="saveInicio">Guardar</button></div>`);
}

/* ---------- fotos ---------- */
async function uploadFiles(files, hidden){
  if(!files.length) return;
  toast(`Subiendo ${files.length} foto${files.length>1?'s':''}…`);
  let ok = 0;
  for(const file of files){
    try{
      const [thumb, full] = await Promise.all([compress(file, 480, .72), compress(file, 1600, .82)]);
      const id = await Store.add('fotos', {thumb, caption:'', date:ymd(new Date(file.lastModified || Date.now())), hidden, by:me()});
      await Store.uploadFull(id, await (await fetch(full)).blob()); ok++;
    }catch(e){ toast('No se pudo subir '+file.name); }
  }
  if(ok) award(5*ok, `por ${ok>1?'las fotos':'la foto'}`);
}
async function openFoto(id){
  const f = S.data.fotos.find(x=>x.id===id); if(!f) return;
  modal(`<img id="fullimg" src="${f.thumb}" alt="" style="width:100%;border-radius:12px;margin-top:20px">
    <label for="f-cap">Descripción</label><input id="f-cap" value="${esc(f.caption)}" placeholder="Ej: nuestra primera playa">
    <label for="f-date">Fecha</label><input id="f-date" type="date" value="${f.date||''}">
    <label class="check"><input type="checkbox" id="f-hid" ${f.hidden?'checked':''}> Foto oculta (solo con PIN)</label>
    <p class="muted" style="margin-top:8px">${f.lat!=null ? '📍 Está en el mapa' : 'Todavía no está en el mapa'}</p>
    <div class="actions"><button class="btn red" data-act="saveFoto" data-id="${id}">Guardar</button><button class="btn ghost" data-act="ubicarFoto" data-id="${id}">📍 Ubicar en el mapa</button><button class="btn ghost" data-act="delFoto" data-id="${id}">Eliminar</button></div>`);
  const url = await Store.fullUrl(id);
  if(url && $('#fullimg')) $('#fullimg').src = url;
}

/* ---------- formularios ---------- */
const FORMS = {
  recuerdo:{t:'Nuevo recuerdo', f:[['titulo','Título'],['fecha','Fecha','date'],['texto','Qué pasó','textarea']], need:['titulo','fecha'], def:()=>({fecha:ymd()}),
    async save(v){ await Store.add('recuerdos', {...v, by:me()}); award(10, 'por guardar un recuerdo'); }},
  fecha:{t:'Fecha importante', f:[['titulo','Qué celebramos'],['fecha','Fecha','date'],['anual','Se repite cada año','check'],['aviso','Avisarnos','select',[['1','1 día antes'],['3','3 días antes'],['7','Una semana antes'],['15','15 días antes'],['30','Un mes antes']]]],
    need:['titulo','fecha'], def:()=>({anual:true, aviso:'7'}), async save(v){ await Store.add('fechas', {...v, aviso:+v.aviso}); toast('Fecha guardada'); }},
  plan:{t:'Nuevo plan', f:[['tipo','Tipo','select',Object.entries(TIPOS)],['titulo','Qué vamos a hacer'],['fecha','Fecha','date'],['hora','Hora','time'],['hasta','Hasta (si es un viaje)','date'],['lugar','Dónde'],['notas','Notas','textarea'],['estado','Estado','select',[['idea','Solo una idea'],['planeado','Ya está planeado']]]],
    need:['titulo'], def:()=>({tipo:S.planTab, estado:'planeado'}), async save(v){ await Store.add('planes', {...v, by:me()}); S.planTab = v.tipo; toast('Plan guardado'); }},
  cancion:{t:'Nueva canción', f:[['titulo','Canción'],['artista','Artista'],['link','Enlace de Spotify o YouTube','url'],['nota','¿Por qué es nuestra?','textarea']], need:['titulo'],
    async save(v){ await Store.add('canciones', {...v, by:me()}); award(3, 'por la canción'); }},
  cupon:{t:'Regalar un cupón', f:[['titulo','Vale por…'],['desc','Detalles','textarea']], need:['titulo'], def:()=>({titulo:'Vale por '}),
    async save(v){ await Store.add('cupones', {...v, de:me(), canjeado:false}); award(5, 'por regalar un cupón'); }},
  premio:{t:'Nuevo premio', f:[['titulo','Premio'],['costo','Cuesta (puntos)','number']], need:['titulo'], def:()=>({costo:50}),
    async save(v){ await Store.add('premios', {titulo:v.titulo, costo:Math.max(1, +v.costo || 50)}); toast('Premio creado'); }},
};
function openForm(name){
  const F = FORMS[name], d = F.def ? F.def() : {};
  modal(`<h2>${F.t}</h2>${F.f.map(([id,label,type='text',opts]) => {
    const v = esc(d[id] ?? '');
    if(type==='textarea') return `<label for="fm-${id}">${label}</label><textarea id="fm-${id}" rows="3">${v}</textarea>`;
    if(type==='select') return `<label for="fm-${id}">${label}</label><select id="fm-${id}">${opts.map(([k,t]) => `<option value="${k}" ${String(k)===String(d[id])?'selected':''}>${t}</option>`).join('')}</select>`;
    if(type==='check') return `<label class="check"><input type="checkbox" id="fm-${id}" ${d[id]?'checked':''}> ${label}</label>`;
    return `<label for="fm-${id}">${label}</label><input id="fm-${id}" type="${type}" value="${v}">`;
  }).join('')}<div class="actions"><button class="btn red" data-act="save" data-f="${name}">Guardar</button></div>`);
}

function verPlan(id){
  const p = S.data.planes.find(x=>x.id===id); if(!p) return;
  modal(`<h2>${esc(p.titulo)}</h2><p class="muted">${TIPOS[p.tipo]||''}${p.fecha ? ', '+fmt(p.fecha) : ''}${p.hora ? ' a las '+p.hora : ''}${p.hasta ? ' hasta el '+fmt(p.hasta) : ''}</p>
    ${p.lugar ? `<p style="margin-top:8px">📍 ${esc(p.lugar)}</p>` : ''}${p.notas ? `<p style="margin-top:8px;white-space:pre-wrap">${esc(p.notas)}</p>` : ''}
    <div class="actions">${p.estado!=='hecho' ? `<button class="btn red" data-act="hecho" data-id="${id}">¡Lo cumplimos!</button>` : ''}
    ${p.estado==='idea' ? `<button class="btn ghost" data-act="planeado" data-id="${id}">Ya está planeado</button>` : ''}
    ${p.fecha ? `<a class="btn ghost" href="${gcal(p.titulo, p.fecha, false, p.hora)}" target="_blank" rel="noopener">Google Calendar</a>` : ''}
    <button class="btn ghost" data-act="del" data-c="planes" data-id="${id}">Eliminar</button></div>`);
}

/* ---------- acciones ---------- */
const ACT = {
  close: closeModal,
  go: d => { closeModal(); go(d.v); },
  async demo(d){ S.user = {uid:d.u}; boot(); },
  async login(){
    try{ await authApi.login($('#li-e').value.trim(), $('#li-p').value); }
    catch(e){ $('#li-err').textContent = 'Correo o contraseña incorrectos.'; }
  },
  async logout(){ if(map){ map.remove(); map=null; } S.unlocked = false; await authApi.logout(); },
  foto: d => d.id ? openFoto(d.id) : null,
  subir: () => $('#up').click(),
  async ocultas(){
    if(S.unlocked) return go('ocultas');
    if(!S.info.pinHash) return ACT.cambiarPin();
    modal(`<h2>Fotos ocultas</h2><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off"><div class="actions"><button class="btn red" data-act="abrirPin">Abrir</button></div>`);
    setTimeout(()=>$('#pin')?.focus(), 50);
  },
  cambiarPin(){
    modal(`<h2>${S.info.pinHash ? 'Cambiar' : 'Crear'} PIN</h2><p class="muted">Lo usarán los dos para ver las fotos ocultas.</p>
      ${S.info.pinHash ? '<label for="pin-old">PIN actual</label><input id="pin-old" type="password" inputmode="numeric" maxlength="8">' : ''}
      <label for="pin">PIN nuevo (4 a 8 números)</label><input id="pin" type="password" inputmode="numeric" maxlength="8"><div class="actions"><button class="btn red" data-act="crearPin">Guardar PIN</button></div>`);
  },
  async crearPin(){
    if(S.info.pinHash && await sha($('#pin-old').value) !== S.info.pinHash) return toast('El PIN actual no es correcto');
    const p = $('#pin').value;
    if(!/^\d{4,8}$/.test(p)) return toast('El PIN debe tener de 4 a 8 números');
    await Store.set('pareja', 'info', {pinHash: await sha(p)});
    S.unlocked = true; closeModal(); toast('PIN guardado'); go('ocultas');
  },
  async abrirPin(){
    if(await sha($('#pin').value) === S.info.pinHash){ S.unlocked = true; closeModal(); go('ocultas'); }
    else toast('PIN incorrecto');
  },
  bloquear(){ S.unlocked = false; go('album'); },
  async saveFoto(d){
    await Store.update('fotos', d.id, {caption:$('#f-cap').value.trim(), date:$('#f-date').value, hidden:$('#f-hid').checked});
    closeModal(); toast('Foto guardada');
  },
  ubicarFoto(d){ S.mapPick = {type:'foto', id:d.id}; closeModal(); go('mapa'); },
  async delFoto(d){
    if(!confirm('¿Eliminar esta foto para siempre?')) return;
    await Store.remove('fotos', d.id); await Store.removeFull(d.id); closeModal(); toast('Foto eliminada');
  },
  pickInicio(){ S.mapPick = {type:'inicio'}; render(); },
  cancelPick(){ S.mapPick = null; render(); },
  miUbic(){
    if(!navigator.geolocation) return toast('Tu navegador no comparte ubicación');
    navigator.geolocation.getCurrentPosition(p => onMapPick({lat:p.coords.latitude, lng:p.coords.longitude}), () => toast('No se pudo obtener tu ubicación'));
  },
  async saveInicio(){
    const nombre = $('#li-n').value.trim(); if(!nombre) return toast('Ponle nombre al lugar');
    await Store.set('pareja', 'info', {lugar:{lat:+$('#li-lat').value, lng:+$('#li-lng').value, nombre, historia:$('#li-h').value.trim()}});
    S.mapPick = null; closeModal(); toast('Lugar guardado'); render();
  },
  form: d => openForm(d.f),
  async save(d){
    const F = FORMS[d.f], v = {};
    F.f.forEach(([id]) => { const el = $('#fm-'+id); v[id] = el.type==='checkbox' ? el.checked : el.value.trim(); });
    const miss = F.need.find(k => !v[k]);
    if(miss) return toast('Falta: ' + F.f.find(x=>x[0]===miss)[1].toLowerCase());
    closeModal(); await F.save(v);
  },
  async del(d){ if(!confirm('¿Eliminar?')) return; closeModal(); await Store.remove(d.c, d.id); },
  verPlan: d => verPlan(d.id),
  async hecho(d){ await Store.update('planes', d.id, {estado:'hecho', hechoEn:ymd()}); closeModal(); award(20, 'por cumplir un plan'); },
  async planeado(d){ await Store.update('planes', d.id, {estado:'planeado'}); closeModal(); },
  planTab(d){ S.planTab = d.t; render(); },
  cupTab(d){ S.cupTab = d.t; render(); },
  async canjear(d){
    const c = S.data.cupones.find(x=>x.id===d.id); if(!c || !confirm(`¿Canjear "${c.titulo}"?`)) return;
    await Store.update('cupones', d.id, {canjeado:true, canjeadoEn:ymd()});
    await Store.add('chat', {text:`🎟️ Canjeé el cupón: ${c.titulo}`, by:me()});
    toast('Cupón canjeado. Ya le avisamos por el chat');
  },
  async canjearPremio(d){
    const q = S.data.premios.find(x=>x.id===d.id); if(!q || ptsOf(me()) < q.costo) return;
    if(!confirm(`¿Canjear "${q.titulo}" por ${q.costo} puntos?`)) return;
    await Store.incr('puntos', me(), 'pts', -q.costo);
    await Store.add('chat', {text:`🏆 Canjeé el premio: ${q.titulo}`, by:me()});
    toast('Premio canjeado. Ya le avisamos por el chat');
  },
  async send(){
    const el = $('#msg'), text = el.value.trim(); if(!text) return;
    el.value = ''; await Store.add('chat', {text, by:me()}); el.focus();
  },
  async saveAjustes(){
    const n = $('#a-n').value.trim(), i = $('#a-i').value;
    if(n) await Store.set('puntos', me(), {name:n});
    if(i) await Store.set('pareja', 'info', {inicio:i});
    toast('Cambios guardados');
  },
  async notif(){
    if(!('Notification' in window)) return toast('Este navegador no permite avisos');
    const p = await Notification.requestPermission();
    toast(p==='granted' ? 'Avisos activados' : 'No se activaron los avisos');
    checkAlerts(); render();
  },
};

document.addEventListener('click', e => {
  if(e.target.id === 'modal') return closeModal();
  const a = e.target.closest('[data-act]');
  if(a && ACT[a.dataset.act]){ e.preventDefault(); ACT[a.dataset.act](a.dataset, a); }
});
document.addEventListener('change', e => { if(e.target.id === 'up'){ uploadFiles([...e.target.files], S.view === 'ocultas'); e.target.value = ''; } });
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.id === 'msg'){ e.preventDefault(); ACT.send(); }
  if(e.key === 'Enter' && e.target.id === 'pin'){ e.preventDefault(); (S.info.pinHash && !$('#pin-old') ? ACT.abrirPin : ACT.crearPin)(); }
  if(e.key === 'Escape') closeModal();
});

initBackend().catch(e => { $('#app').innerHTML = `<div class="login"><h2>No se pudo conectar</h2><p class="muted">Revisa los datos de Supabase y tu conexión a internet.</p></div>`; });
</script>
